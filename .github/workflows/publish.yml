name: publish-and-release

# Each merge into main releases 4.x from what its fragments describe. A manual
# run (`gh workflow run publish.yml -f version=major`) forces a bump.
#
# `.changelog/prerelease` (`alpha`) makes each release a prerelease
# (4.0.0-alpha.2, …) on the `next` dist-tag, which keeps `latest` on 3.x. A pull
# request that deletes the file releases 4.0.0 on `latest`.
#
# The `3.x` branch keeps its own copy of this file, which publishes on a tag
# push. Tags pushed by this workflow start no other workflow.
#
# npm trusted publishing is bound to this file name: keep the publish job here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: `auto` follows the fragments; `patch`, `minor` or `major` forces that bump'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time. GitHub keeps only the newest pending run: it
# releases everything that main has at that point.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Ubuntu, not macOS: the specs run in a real Chromium, and `playwright
  # install --with-deps` only installs system dependencies on Ubuntu.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build the published packages
        run: npm run build

      # The specs cover native view transitions, frame-aligned scheduling and
      # DOM lifecycle: they need a real browser.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/js-toolkit

      - name: Test js-toolkit
        run: npm test
        working-directory: packages/js-toolkit

      # Packs the package and runs the result through a Node, a browser and a
      # TypeScript consumer, without the workspace aliases.
      - name: Check the packed package
        run: npm run check:package
        working-directory: packages/js-toolkit

      - name: Test eslint-plugin
        run: npm test -- --retry=3 --coverage.enabled
        working-directory: packages/eslint-plugin

      - name: Upload eslint-plugin coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/eslint-plugin/coverage/clover.xml
          flags: eslint-plugin-js-toolkit
          fail_ci_if_error: false
          verbose: true

  # Folds the fragments, bumps every package.json, commits `chore: release
  # <version>`, tags, pushes and creates the GitHub release.
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release
        id: release
        uses: weareikko/changelog@9d93346df9858eaa29007bd8530aad8f4c5b539a # 0.1.0
        with:
          command: release
          version: ${{ inputs.version || 'auto' }}
          commit-message: 'chore: release {version}'

  # "Re-run failed jobs" on this job publishes what a failed run left: npm
  # skips a version that it already has.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # The action publishes with --ignore-scripts: this step builds `dist/`,
      # and the test job ran the checks.
      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Trusted publishing (OIDC): no npm token. A prerelease goes to `next`.
      - name: Publish @studiometa/js-toolkit
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/js-toolkit
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

      - name: Publish @studiometa/eslint-plugin-js-toolkit
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/eslint-plugin
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
