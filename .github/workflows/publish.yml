name: publish-and-release

# A tag publishes the packages that live on the branch it points at, so this
# file needs no version gate: a `4.x` tag is created here and publishes v4,
# while a `3.x` tag is created on the `3.x` branch, whose copy of this file
# publishes v3. The workflow always runs from the ref of the tag.
#
# A prerelease goes to the `next` dist-tag, which is what keeps `latest` on
# 3.x while 4.x is an alpha.

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            **/node_modules
            .eslintcache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci --no-audit --no-fund

      - name: Build the published packages
        run: npm run build

      # The specs run in a real browser, so the runner needs one. They cover
      # native view transitions, frame-aligned scheduling and DOM lifecycle,
      # which is what makes them worth running again on the release commit
      # rather than trusting the pull request that produced it.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/js-toolkit

      - name: Test js-toolkit
        run: npm test
        working-directory: packages/js-toolkit

      # The last gate before the tarball goes out: packs the package and runs
      # the result through a Node, a browser and a TypeScript consumer, without
      # the workspace aliases. What passes here is what a consumer installs.
      - name: Check the packed package
        run: npm run check:package
        working-directory: packages/js-toolkit

      - name: Test oxlint-plugin
        run: npm test -- --retry=3 --coverage.enabled
        working-directory: packages/eslint-plugin

      - name: Upload oxlint-plugin coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/eslint-plugin/coverage/clover.xml
          flags: eslint-plugin-js-toolkit
          fail_ci_if_error: false
          verbose: true

      - run: |
          NPM_TAG='latest'
          IS_PRERELEASE=false

          if [[ $GITHUB_REF_NAME =~ 'alpha' || $GITHUB_REF_NAME =~ 'beta' || $GITHUB_REF_NAME =~ 'rc' ]]; then
            NPM_TAG='next'
            IS_PRERELEASE=true
          fi

          echo "NPM_TAG=$NPM_TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV

      - uses: JS-DevTools/npm-publish@v3
        with:
          provenance: true
          package: packages/js-toolkit/
          tag: ${{ env.NPM_TAG }}
          token: ${{ secrets.NPM_TOKEN }}

      - uses: JS-DevTools/npm-publish@v3
        with:
          provenance: true
          package: packages/eslint-plugin/
          tag: ${{ env.NPM_TAG }}
          token: ${{ secrets.NPM_TOKEN }}

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref }}
          name: v${{ github.ref_name }}
          body: Please refer to [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
