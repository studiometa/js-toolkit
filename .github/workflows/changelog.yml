name: changelog

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every change to the published sources needs a fragment in .changelog/,
      # unless the pull request has the `no-changelog` label (tests, refactors,
      # tooling).
      - uses: weareikko/changelog@9d93346df9858eaa29007bd8530aad8f4c5b539a # 0.1.0
        with:
          command: check
          require-paths: |
            packages/js-toolkit/src/**
            packages/eslint-plugin/src/**
