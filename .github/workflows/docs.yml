name: docs

# The v3 documentation is deployed from this branch, not from `main`.
#
# `main` carries v4 now, and v4 takes the `@studiometa/js-toolkit` name at
# 4.0.0-alpha.0. While that release is a prerelease, `latest` on npm is still
# 3.x, so `js-toolkit.studiometa.dev` must keep serving these pages. The
# Cloudflare Pages project `js-toolkit` has its production branch set to `3.x`
# for that reason, and the deploy below names the branch explicitly — a
# checkout in Actions can be detached, and an inferred branch would land the
# build on a preview URL instead of the custom domain.
#
# The v4 job that used to live here stayed on `main`: deploying the
# `js-toolkit-v4` project from this branch would publish a frozen copy of v4
# over the live one.
on:
  push:
    branches: [3.x]
  pull_request:
    branches:
      - 3.x

jobs:
  deploy-v3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy packages/docs/.vitepress/dist --project-name=js-toolkit --branch=3.x
