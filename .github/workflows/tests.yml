name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-progress --no-fund
      - name: Build
        run: npm run build

  code-quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-progress --no-fund
      - name: Check the subpath stubs
        run: npm run subpaths:check
      - name: Run code quality tests
        run: npm run lint:static
      - name: Run format tests
        run: npm run lint:fmt
      - name: Run types tests
        run: npm run lint:types

  js-toolkit:
    name: unit (js-toolkit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-progress --no-fund
        working-directory: .
      # The specs run in a real browser: they cover native view transitions,
      # frame-aligned scheduling and DOM lifecycle, none of which a DOM
      # emulation can answer for.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
      - name: Check types
        run: npm run lint:types
      - name: Check the packed package
        run: npm run check:package

  eslint-plugin:
    name: unit (eslint-plugin-js-toolkit)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/eslint-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-progress --no-fund
        working-directory: .
      - name: Run tests
        run: npm test -- --retry=3 --coverage.enabled
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: packages/eslint-plugin/coverage/clover.xml
          flags: eslint-plugin-js-toolkit
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
