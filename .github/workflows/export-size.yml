name: export-size

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/js-toolkit/**'
      - 'packages/v4/**'
      - 'package-lock.json'
      - '.github/workflows/export-size.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  export_size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: weareikko/export-size@1
        with:
          # `packages/js-toolkit/` is the folder npm publishes, so the report
          # measures exactly what a consumer installs. The v4 prototype now
          # resolves to its own `dist/` too, so `build-for-export-size` builds
          # both packages: both appear in the same report and can be compared
          # export by export.
          packages: |
            @studiometa/js-toolkit:packages/js-toolkit
            @studiometa/js-toolkit-v4:packages/v4
          build: npm run build-for-export-size
