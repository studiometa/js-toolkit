name: export-size

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/js-toolkit/**'
      - 'packages/v4/**'
      - 'package-lock.json'
      - '.github/workflows/export-size.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  export_size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: weareikko/export-size@1
        with:
          # `packages/js-toolkit/` is the folder npm publishes, so the report
          # measures exactly what a consumer installs; the v4 prototype is
          # measured straight from its TypeScript sources (esbuild resolves
          # them), so both packages appear in the same report and can be
          # compared export by export.
          packages: |
            @studiometa/js-toolkit:packages/js-toolkit
            @studiometa/js-toolkit-v4:packages/v4
          build: npm run build-for-export-size
